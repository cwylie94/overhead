appId: com.craigwylie.overhead
name: Switching the language to Spanish and back
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
      notifications: deny
- runFlow: subflows/finish-onboarding.yaml
- tapOn:
    id: tab-settings
- tapOn: Español
- assertVisible: Ajustes
- assertVisible: Idioma
- tapOn:
    id: tab-tonight
- assertVisible: Esta noche
- tapOn:
    id: tab-settings
- tapOn: English
- assertVisible: Language
