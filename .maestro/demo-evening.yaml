appId: com.craigwylie.overhead
name: Demo evening, from the Tonight list to the collection
---
- launchApp:
    clearState: true
    permissions:
      location: inuse
      notifications: deny
- openLink: overhead://demo
- tapOn:
    text: Open
    optional: true
- assertVisible: 'Demo mode: .* in London. Turn it off in Settings.'
- extendedWaitUntil:
    visible: "ISS \\(ZARYA\\).*"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: catch-25544
    timeout: 120000
- tapOn:
    id: catch-25544
- assertVisible: "Catch ISS \\(ZARYA\\)"
- assertVisible: 'Drag to aim. Keep your finger down to hold.'
- assertVisible: 'Appears in .*'
- extendedWaitUntil:
    visible: Line up the crosshair with the satellite
    timeout: 90000
- tapOn: Done
- tapOn:
    id: tab-sky
- assertVisible: 'Tap a satellite to see where to look.*'
- tapOn:
    id: tab-collection
- assertVisible: Space stations
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: demo-mode
    centerElement: true
- tapOn:
    id: demo-mode
- assertVisible: Satellites cross your sky every night
