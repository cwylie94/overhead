appId: com.craigwylie.overhead
---
- tapOn:
    id: onboarding-start
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-camera-next
- tapOn:
    id: onboarding-reminders-later
- assertVisible: Where are you watching from?
- runFlow:
    when:
      visible:
        id: onboarding-use-location
    commands:
      - tapOn:
          id: onboarding-use-location
          optional: true
- runFlow:
    when:
      visible:
        id: onboarding-continue
    commands:
      - tapOn:
          id: onboarding-continue
